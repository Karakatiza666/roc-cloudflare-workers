# The examples with Talon (research/talon-fit/TRANSITION.md 6.1): install tln, install the pinned
# nightly and make it the default compiler, fetch the closure, build each example and
# run its sync, then check that the committed worker.js files are what sync writes.
# No npm: sync is `node js/cli.mjs`. No Wrangler: sync reads wrangler.toml as text.
# The test helper (js/test.mjs, research/design-notes/test-helper.md S8): its tests run on examples/hello and
# test-helper/app, built on the production host, in the Miniflare of the pinned global wrangler (README "Testing an app").
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    env:
      TALON_AUTO_INSTALL: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install Talon
        run: |
          curl -fsSL https://github.com/roc-talon/talon/releases/download/v0.0.1/install.sh | sh -s -- --yes --version 0.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # tln setup already set the newest nightly as the default, so set the pin as the default too.
      - name: Install the pinned nightly
        run: |
          tln roc install "$(cat compat/last-stack-first-nightly)"
          tln roc default "$(cat compat/last-stack-first-nightly)"
      - name: Install packages
        run: tln install --frozen
      # The examples use the platform from source: its host (platform/targets/wasm32/host.wasm) is a build output.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build the platform host
        run: zig build
      - name: Build the examples and sync
        run: tln run examples
      - name: The committed worker.js files are what sync writes
        run: git diff --exit-code examples/
      - name: Install wrangler (the Miniflare of the test helper)
        run: npm install -g wrangler@4.151.0
      - name: Build the app of the test helper tests
        run: tln run helper
      - name: Test helper (wrapEnv, the count rules, startApp, the run dirs)
        run: |
          node test-helper/wrapenv-test.mjs test-helper/app/app.wasm
          node test-helper/count-test.mjs
          node test-helper/helper-test.mjs examples/hello/app.wasm test-helper/app/app.wasm
          test-helper/helper-tmpdir.sh test-helper/app/app.wasm

  # The claim `min_nightly` of js/cfw.json (research/min-nightly/README.md): the apps build with that nightly
  # against the hosts of the pinned nightly, and the tests that take a wasm file pass.
  min-nightly:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: npm install -g wrangler
      - uses: actions/cache@v4
        with:
          path: .cache/nightlies
          key: nightlies-${{ hashFiles('js/cfw.json', 'compat/last-stack-first-nightly') }}
      - name: Build and test with min_nightly
        run: |
          export ZIG=$(which zig)
          export WORKERD="$(npm root -g)/wrangler/node_modules/@cloudflare/workerd-linux-64/bin/workerd"
          research/min-nightly/ci.sh
