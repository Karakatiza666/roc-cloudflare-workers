name = "probe-worker"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal", "global_fetch_strictly_public"]

[triggers]
crons = ["*/5 * * * *", "0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "probe"
database_id = "00000000-0000-0000-0000-000000000000"
