name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TALON_AUTO_INSTALL: "yes"
    steps:
      - uses: actions/checkout@v4
      - name: Install Talon
        run: curl -fsSL https://github.com/roc-talon/talon/releases/download/v0.0.1/install.sh | sh -s -- --yes --version 0.0.1
      - name: Install packages
        run: tln install --frozen
      - name: Check
        run: roc check
      - name: Test
        run: roc test
