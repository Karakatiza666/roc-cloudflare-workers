name = "b3-kinds"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal"]
version_metadata = { binding = "VERSION" }
assets = { directory = "./public", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "b3"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "b3-bucket"

[[durable_objects.bindings]]
name = "THINGS"
class_name = "Thing"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Thing"]

[[services]]
binding = "SELF"
service = "b3-kinds"

[[queues.producers]]
binding = "JOBS"
queue = "b3-jobs"

[[send_email]]
name = "MAIL"

[[workflows]]
binding = "FLOW"
name = "b3-flow"
class_name = "Flow"

[[hyperdrive]]
binding = "HD"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://u:p@127.0.0.1:5432/db"

[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "b3"
